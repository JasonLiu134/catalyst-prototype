<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal Tab</title>
    <link rel="stylesheet" href="style.css" class="css">
</head>
<body>
    <div class="headingimage">
        <a href="index.html">
            <img src="assets/Transparent Black.png" alt="Description of image" style="width: 60px; height: auto;"/>
        </a>
    </div>
    <div class="headingspace"></div>
    <div class="heading">
        <button class="heading-button" onclick="window.location.href='about.html'">About</button>
        <button class="heading-button" onclick="window.location.href='apply.html'">Apply</button>
        <button class="heading-button" onclick="window.location.href='board.html'">Board</button>
        <button class="heading-button current" onclick="window.location.href='journals.html'">Journals</button>
    </div>

    <h1 class="centeredtext"><b>Journal Volumes</b></h1>
    
    <div class="journal-container">
        <div class="journal-preview" data-volume="1">
            <div class="journal-thumbnail">
                <img src="./assets/volume1cover-1.png" alt="cover of volume 1">
            </div>
            <div class="journal-title">Volume 1</div>
        </div>
        <div class="journal-preview" data-volume="2">
            <div class="journal-thumbnail">
                <img src="./assets/volume2cover1-1.png" alt="cover of volume 2">
            </div>
            <div class="journal-title">Volume 2</div>
        </div>
        <!-- <div class="journal-preview" data-volume="3">
            <div class="journal-thumbnail">
                <img src="./assets/volume1cover-1.png" alt="cover of volume 3">
            </div>
            <div class="journal-title">Volume 3</div>
        </div> -->
    </div>

    <div class="selectjournal">
        <ul class="box-list-journal">
            <li><button class="boxbutton selectedjournal" data-volume="1">Volume 1</button></li>
            <li><button class="boxbutton" data-volume="2">Volume 2</button></li>
            <li><button class="boxbutton" data-volume="3">Volume 3</button></li>
        </ul>
    </div>

    <div class="modal" id="journalModal">
        <div class="modal-content">
            <div class="modal-close" id="modalClose"></div>
            <div class="modal-body">
                <iframe id="modalIframe" class="modal-iframe" src="./journals/volume1.pdf#toolbar=0"></iframe>
            </div>
        </div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
